# Pi executable binding for pi-sandbox-guard.
#
# PREFERRED: do not hand-edit this file. Run `npm run bind` (scripts/bind-executable.sh),
# which detects your install, shows you the exact launch it will record, asks for
# confirmation, and writes the canonical absolute paths here. It refuses to record
# anything the shim would later reject, so you get the error at bind time instead of at
# launch time.
#
#   npm run bind                 detect, confirm, record
#   npm run bind -- --show       print what is recorded now
#   npm run bind -- --check      verify it still resolves (exit 3 if stale)
#   npm run bind -- --pi <abs>   record an explicit path
#
# Copy to ~/.config/pi-sandbox-guard/executables.conf if you do write it by hand.

# ---------------------------------------------------------------------------
# pi=<absolute path to the real Pi executable>
#
# Leave unset only if your Pi is an npm install into /opt/homebrew or /usr/local:
# those are the sole layouts auto-detection can find, because it searches a fixed list
# of trusted path shapes. Everything else needs this key — the Homebrew *formula*
# (Cellar/libexec), npm's default sudo-free prefix (~/.npm-global), nvm/fnm/volta/
# asdf/mise, pnpm/bun/yarn globals, and Nix.
#
# A recorded value here is EXEMPT from the trusted-prefix list. That exemption is why
# this file is read only from under the real home directory and why the protected shim
# ignores an ambient PI_EXECUTABLE_CONFIG: the value must be operator-recorded host
# state, never something a project or a confined Pi session can set. It is a
# non-ambient host pin, NOT an integrity control — a same-uid attacker outside the
# sandbox who can edit this file could equally replace the shim or Pi itself.
#
# Still enforced for every source: absolute, exists, executable, not a directory, not
# the shim itself (that loops), and not inside a Seatbelt write root (PROJECT, TMPDIR,
# /private/tmp, ~/.pi/agent, ~/.npm, ~/.cache, ~/Library/Caches) — an executable the
# sandboxed agent can rewrite would persist across every later launch.
# ---------------------------------------------------------------------------

# npm into Homebrew prefix (auto-detected; key optional):
# pi=/opt/homebrew/lib/node_modules/@earendil-works/pi-coding-agent/dist/cli.js

# Homebrew formula (NOT auto-detected — canonicalizes into Cellar):
# pi=/opt/homebrew/Cellar/pi-coding-agent/0.82.1/libexec/bin/pi

# npm default sudo-free prefix (NOT auto-detected):
# pi=/Users/you/.npm-global/lib/node_modules/@earendil-works/pi-coding-agent/dist/cli.js

# ---------------------------------------------------------------------------
# node=<absolute path to the interpreter>
#
# Needed when the recorded `pi` is a `#!/usr/bin/env node` script AND your Node is not
# in a trusted prefix — i.e. any version manager. The shim's pre-sandbox PATH lists only
# Homebrew and system bins, so the shebang would fail to find `node` there. With this
# key the launch becomes `<node> <cli.js>` instead of relying on shebang lookup.
#
# This key is read under a name the executable lookup CANNOT select. PI_EXECUTABLE_KEY
# is caller-settable, so if `node` were reachable that way a wrapper could export
# PI_EXECUTABLE_KEY=node and run the interpreter as Pi, skipping Pi's own tool layer.
# ---------------------------------------------------------------------------

# node=/Users/you/.nvm/versions/node/v24.0.0/bin/node

# ---------------------------------------------------------------------------
# Custom wrappers (see launchers/example-custom) need no key of their own. A wrapper
# execs its sibling protected `pi` shim by path, so the `pi` key above is what gets
# looked up, not the wrapper's name.
#
# Note the protected shim reads a FIXED `pi` key and ignores an ambient
# PI_EXECUTABLE_KEY. That variable still selects a key for non-transparent
# (guard-only, no Seatbelt) invocations, where the trusted-prefix rules apply to
# whatever it resolves to.
# ---------------------------------------------------------------------------
